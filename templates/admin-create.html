{{define "content"}}
<div class="admin-form-container">
    <h2>Write a New Story</h2>
    
    <form action="/admin/create" method="POST" enctype="multipart/form-data" class="admin-form">
        <div class="form-group">
            <label for="title">Story Title</label>
            <input type="text" id="title" name="title" required placeholder="Enter an enchanting title...">
        </div>

        <div class="form-group">
            <label for="author">Author Name</label>
            <input type="text" id="author" name="author" value="{{.Admin.DisplayName}}" required placeholder="Your name or pen name">
        </div>

        <div class="form-group">
            <label for="image">Cover Image (optional)</label>
            <input type="file" id="image" name="image" accept="image/*">
        </div>

        <div class="form-group">
            <label for="content">Story Content</label>
            <textarea id="content" name="content" rows="15" required placeholder="Once upon a time..."></textarea>
        </div>

        <div class="form-actions">
            <button type="submit" class="btn-publish"><i class="fa-solid fa-book-bookmark"></i> Publish Story</button>
            <a href="/admin/dashboard" class="btn-cancel">Cancel</a>
        </div>
    </form>
</div>
{{end}}
